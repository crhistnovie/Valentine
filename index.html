<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:linear-gradient(270deg,#ff9a9e,#fad0c4,#fad0c4,#ffdde1);
    background-size:600% 600%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* START SCREEN */
#startScreen{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:999;
cursor:pointer;
}

.netflix-logo{
font-size:3rem;
color:#e50914;
letter-spacing:4px;
animation:zoomIn 1.5s ease;
}

.tap{
margin-top:20px;
opacity:.8;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{opacity:.3}
50%{opacity:1}
}

@keyframes zoomIn{
from{transform:scale(.3);opacity:0}
to{transform:scale(1);opacity:1}
}

/* Floating hearts */

.heart{
    position:fixed;
    top:-20px;
    font-size:20px;
    animation:fall linear forwards;
}


/* MAIN */
.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.title{
font-family:'Great Vibes',cursive;
font-size:clamp(2.5rem,6vw,5rem);
color:white;
text-shadow:0 0 20px rgba(255,255,255,.9);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-15px)}
}

.letter{
max-width:700px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
padding:25px;
border-radius:20px;
margin-top:25px;
color:white;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

.compat{
margin-top:20px;
width:min(90vw,400px);
height:20px;
background:rgba(255,255,255,.3);
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0;
background:linear-gradient(90deg,#ff4d6d,#ff758f);
transition:width .3s;
}

.buttons{
margin-top:30px;
position:relative;
width:100%;
height:200px;
}

button{
padding:15px 25px;
border:none;
border-radius:30px;
font-size:1.1rem;
cursor:pointer;
position:absolute;
}

#yesBtn{
background:#ff4d6d;
color:white;
left:40%;
}

#noBtn{
background:white;
}

/* POPUP */
#popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

.popup-box{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
animation:zoomIn .5s;
}

/* petals */
.petal{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg)}
}

@media (max-width:900px){
.buttons{height:250px}
}

</style>
</head>
<body>

<div id="startScreen">
<div class="netflix-logo">LOVEFLIX</div>
<div class="tap">Appuie pour commencer ❤️</div>
</div>

<audio id="music" src="Rihanna, Justin Timberlake - Rehab (Lyrics Video) 🎤.mp3" loop></audio>
<audio id="voice" src=""></audio>

<div class="container">
<div class="title">Veux-tu être ma valentine à moi ? 💖</div>

<div class="letter" id="letter">
Depuis que je t'ai rencontrée, tout ressemble à un film Disney... 🌸
</div>

<div class="compat">
<div class="bar" id="bar"></div>
</div>

<div class="buttons" id="btnArea">
<button id="yesBtn">OUI ❤️</button>
<button id="noBtn">NON 😭</button>
</div>
</div>

<div id="popup">
<div class="popup-box">
<h2>Sayez wesh!<br> Joue pas avec moi toi 😭!<br>Accepte maintenant !</h2>
<button onclick="accept()">D'accord ❤️</button>
</div>
</div>

<script>
const start = document.getElementById('startScreen');
const music = document.getElementById('music');
const voice = document.getElementById('voice');
const bar = document.getElementById('bar');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const popup = document.getElementById('popup');

let compat = 0;
let movesAfter100 = 0;

start.addEventListener('click',()=>{
start.style.display='none';
music.play();
voice.play();
startPetals();
});

// Floating hearts generator
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    heart.style.animationDuration=(Math.random()*3+3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);

},300);

function startPetals(){
setInterval(()=>{
const p=document.createElement('div');
p.className='petal';
p.innerHTML='🌸';
p.style.left=Math.random()*100+'vw';
p.style.animationDuration=3+Math.random()*5+'s';
document.body.appendChild(p);
setTimeout(()=>p.remove(),8000);
},300);
}

function increaseCompat(){
if(compat<100){
compat+=20;
bar.style.width=compat+'%';
}
}

function moveNo(){
const area=document.getElementById('btnArea');
const maxX=area.clientWidth-120;
const maxY=area.clientHeight-60;

noBtn.style.left=Math.random()*maxX+'px';
noBtn.style.top=Math.random()*maxY+'px';

increaseCompat();

if(compat===100){
movesAfter100++;
if(movesAfter100>=5){
popup.style.display='flex';
}
}
}

noBtn.addEventListener('mouseenter',moveNo);
noBtn.addEventListener('touchstart',moveNo);

yesBtn.addEventListener('click',()=>{
confetti({particleCount:200,spread:120});
fireworks();
});

function fireworks(){
let duration=2000;
let end=Date.now()+duration;

(function frame(){
confetti({
particleCount:5,
angle:60,
spread:55,
origin:{x:0}
});
confetti({
particleCount:5,
angle:120,
spread:55,
origin:{x:1}
});

if(Date.now()<end){
requestAnimationFrame(frame);
}
})();
}

function accept(){
popup.style.display='none';
confetti({particleCount:300,spread:180});
}


</script>

</body>
</html>
